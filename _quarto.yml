project:
  type: website
  output-dir: docs
  resources:
    - files/

execute:
  freeze: auto

website:
  title: "Nicholas C. Taylor"
  description: "PhD candidate in Statistics at Baylor University working on spatial and spatiotemporal statistics, predictive model validation, and satellite remote sensing for water resources."
  site-url: "https://n-c-taylor.github.io"
  image: images/profile.jpg
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    logo: images/favicon.svg
    logo-alt: "NCT logo"
    right:
      - href: index.qmd
        text: About
      - href: teaching.qmd
        text: Teaching
      # - href: research.qmd
      #   text: Research
      - href: publications-conferences.qmd
        text: Publications
      - href: blog.qmd
        text: Blog
      # The CV link is styled as the filled accent button (see styles.css)
      - text: CV
        href: files/cv.pdf
      - icon: github
        href: https://github.com/n-c-taylor
        aria-label: GitHub
  page-footer:
    left: "© 2026 Nicholas C. Taylor"
    right:
      - icon: envelope
        href: mailto:nicholasclevelandtaylor@gmail.com
        aria-label: Email
      - icon: github
        href: https://github.com/n-c-taylor
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/nicholas-c-taylor
        aria-label: LinkedIn

format:
  html:
    # Dark is listed first, so it is the default; the navbar toggle switches to light.
    theme:
      dark: theme-dark.scss
      light: theme-light.scss
    css: styles.css
    respect-user-color-scheme: false
