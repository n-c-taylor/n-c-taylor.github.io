- id: fastkcv
  name: "fastkcv"
  tagline: "Fast, exact cross-validation for global kriging in R. A companion to gstat: same inputs and outputs as krige.cv(), but a single Cholesky factorization replaces refitting for every fold."
  logo: images/software/fastkcv.png
  language: "R / C++"
  version: "v0.1.0"
  status: "Released Nov 2026"
  date: 2026-11-21
  highlight: "Up to 1,500× faster leave-one-out cross-validation than gstat::krige.cv(), with results that match to numerical precision."
  features:
    - "Leave-one-out, k-fold and buffered (spatial) leave-one-out CV for simple, ordinary and universal kriging"
    - "Random, spatial block and k-means fold builders, plus kcv_metrics() to compare fold designs"
    - "Factorize once with kcv_prepare(), then run many fold schemes with kcv_run()"
    - "Works with data.frame, sf and sp data; nested and anisotropic gstat variogram models"
  install: 'pak::pkg_install("n-c-taylor/fastkcv")'
  repo: https://github.com/n-c-taylor/fastkcv
  docs: https://github.com/n-c-taylor/fastkcv/blob/main/vignettes/fastkcv.Rmd
  docs-label: "Vignette"
