<script>
/* Copy-to-clipboard for any .copy-btn with a data-copy attribute
   (install commands on Software, BibTeX on Publications). */
document.addEventListener("click", function (e) {
  var b = e.target.closest(".copy-btn");
  if (!b) return;
  var text = b.getAttribute("data-copy");
  var label = b.querySelector("span");
  var original = label ? label.textContent : "";
  var done = function () {
    if (label) label.textContent = "Copied";
    b.classList.add("copied");
    setTimeout(function () {
      if (label) label.textContent = original;
      b.classList.remove("copied");
    }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, function () {});
  } else {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (err) {}
    document.body.removeChild(ta);
  }
});
</script>
<script>
/* Software page: show the current package version from the DESCRIPTION file
   on GitHub (falls back to the version in software.yml if the fetch fails). */
document.querySelectorAll("[data-gh-version]").forEach(function (el) {
  var repo = el.getAttribute("data-gh-version");
  fetch("https://raw.githubusercontent.com/" + repo + "/HEAD/DESCRIPTION", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function (txt) {
      var m = txt.match(/^Version:\s*(\S+)/m);
      if (m) el.textContent = "v" + m[1];
    })
    .catch(function () {});
});
</script>
